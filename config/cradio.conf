# ВНИМАНИЕ: раньше здесь были строки вида `#define CONFIG_BT_MAX_CONN 6`.
# Это синтаксис C, а не Kconfig — файл разбирается как список присваиваний,
# так что обе настройки молча не применялись вообще.
#
# Обе половинки теперь периферия донгла: единственное соединение — с ним.
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# --- Параметры сплит-линка задаются НЕ ЗДЕСЬ --------------------------------
#
# КАПКАН, стоивший целого пустого коммита (1fbc15b «пин интервала сплит-линка
# на половинках»). Здесь стоял блок CONFIG_BT_PERIPHERAL_PREF_* — интервал
# 7.5 мс без люфта и latency 0 «против реордера». Он не делал НИЧЕГО, причём по
# двум независимым причинам, каждой из которых хватило бы:
#
#   1. Параметры сплит-линка целиком диктует ЦЕНТРАЛЬНЫЙ в момент подключения.
#      app/src/split/bluetooth/central.c, split_central_eir_found():
#
#          bt_conn_le_create(addr, BT_CONN_LE_CREATE_CONN,
#              BT_LE_CONN_PARAM(CONFIG_ZMK_SPLIT_BLE_PREF_INT,
#                               CONFIG_ZMK_SPLIT_BLE_PREF_INT,
#                               CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY,
#                               CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT), &slot->conn);
#
#      Периферию при этом никто не спрашивает.
#
#   2. Единственный путь, которым периферия могла бы попросить своё, — это
#      автоматический L2CAP-запрос Zephyr через CONFIG_BT_CONN_PARAM_UPDATE_
#      TIMEOUT после коннекта. ZMK его выключает: app/src/split/bluetooth/
#      Kconfig, в ветке `if !ZMK_SPLIT_ROLE_CENTRAL` стоит
#
#          config BT_GAP_AUTO_UPDATE_CONN_PARAMS
#              default n
#
#      То есть половинка свои PREF_* не отправляет вообще никогда, и лежат они
#      здесь мёртвым грузом.
#
# Заодно в том коммите неверна и диагностика: якобы «сплит шёл на дефолтах ZMK
# MAX_INT=12». 12 — это дефолт Zephyr для обычной периферии, к сплиту он
# отношения не имеет. CONFIG_ZMK_SPLIT_BLE_PREF_INT и так равен 6, интервал уже
# был 7.5 мс. Реальная проблема была одна — latency 30, и чинится она на
# ДОНГЛЕ: boards/shields/sweep_dongle/sweep_dongle.conf.
