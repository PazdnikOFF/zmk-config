# ВНИМАНИЕ: раньше здесь были строки вида `#define CONFIG_BT_MAX_CONN 6`.
# Это синтаксис C, а не Kconfig — файл разбирается как список присваиваний,
# так что обе настройки молча не применялись вообще.
#
# Обе половинки теперь периферия донгла: единственное соединение — с ним.
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# --- Параметры сплит-линка (половинка → донгл) ------------------------------
#
# КАПКАН: интервальные крутилки в sweep_dongle.conf управляют линком
# донгл → ХОСТ (там донгл — периферия). Линк донгл → половинки задаётся ОТСЮДА,
# со стороны половинок (они периферия донгла), их PREF_*. Здесь они раньше не
# задавались вовсе — то есть сплит шёл на дефолтах ZMK: MAX_INT=12 (до 15 мс) и
# LATENCY=30. При latency 30 половинка вправе придержать событие до 30
# интервалов, и окно, в котором нажатия с двух рук могут разъехаться по порядку
# (zmkfirmware/zmk#1633), раздувается — отсюда и «буквы меняются местами», и
# вязкость.
#
# Пиним тайтовый штатный BLE без sub-7.5 мс из #3381 (те требуют правок
# контроллера на обеих половинах и, по отчётам автора, ловят падения):
#   - интервал жёстко 7.5 мс (6 единиц по 1.25 мс), min=max, без люфта до 15;
#   - latency 0 — половинка выходит в эфир на КАЖДОМ событии, ничего не
#     придерживает, окно реордера сжимается до одного интервала.
# Ценой чуть большего расхода половинок в простое (радио будит каждые 7.5 мс),
# но приоритет на пути ввода — за отзывчивостью, как и везде в этом конфиге.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=6
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
