# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # Обе половины собираются ОДИНАКОВО. Раньше левая тащила ZMK Studio со
  # снипетом studio-rpc-usb-uart — наследство тех времён, когда она была
  # центральной. Периферии Studio бесполезен: он правит раскладку, а раскладка
  # живёт на донгле. Зато лишняя подсистема с USB-стеком и потоком RPC крутилась
  # на ней постоянно, и левая половина отличалась от правой только этим.
  - board: nice_nano//zmk
    shield: cradio_left

  - board: nice_nano//zmk
    shield: cradio_right
    
  - board: nice_nano//zmk
    shield: settings_reset

  - board: nice_nano//zmk
    shield: sweep_dongle

  # Диагностическая сборка: логи по USB плюс метки времени прихода нажатий.
  # Собирается рядом с обычной, чтобы не приходилось править конфиг ради
  # разового замера.
  #
  # Остаётся в дереве насовсем. Вопрос с задержками ею и закрыт — лог показал,
  # что мак принимает нашу просьбу и даёт latency 0, — но кроме того она дважды
  # оказалась единственным способом отличить «половинка не доехала» от «донгл
  # шлёт не туда». Гадать вместо неё дороже, чем держать лишний таргет в CI.
  - board: nice_nano//zmk
    shield: sweep_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_SWEEP_DONGLE_DEBUG_LATENCY=y -DCONFIG_SWEEP_DONGLE_DEBUG_RESET_REASON=y -DCONFIG_SWEEP_DONGLE_DEBUG_LINKS=y -DCONFIG_ZMK_LOG_LEVEL_INF=y
    artifact-name: sweep_dongle_debug

  # «Тихая» диагностическая сборка донгла.
  #
  # Нужна, потому что обычная отладочная врёт: у ZMK в app/Kconfig стоит
  # `config ZMK_LOG_LEVEL default 4` (а 4 — это DBG), символ без prompt, и
  # -DCONFIG_ZMK_LOG_LEVEL_INF=y его не перебивает. В итоге отладочная прошивка
  # пишет лог на КАЖДОЕ нажатие, причём в системной очереди работ — то есть в
  # кооперативном потоке приоритета -1, который нельзя вытеснить. Любой замер
  # задержки на ней завышен, а на руках это чувствуется как вязкость.
  #
  # ZMK_LOGGING_MINIMAL=y отключает тот самый default, и тогда уровень берётся
  # из выбора. Телеметрия линков сюда НЕ включена: её таймер будит процессор
  # 50 раз в секунду.
  - board: nice_nano//zmk
    shield: sweep_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_LOGGING_MINIMAL=y -DCONFIG_ZMK_LOG_LEVEL_INF=y -DCONFIG_SWEEP_DONGLE_DEBUG_RESET_REASON=y -DCONFIG_SWEEP_DONGLE_DEBUG_HOSTS=y
    artifact-name: sweep_dongle_quiet

  # Диагностика ЛЕВОЙ половинки. Раньше её не было вовсе, хотя жалобы на
  # отставание именно с левой: разбирать было нечем.
  - board: nice_nano//zmk
    shield: cradio_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_SWEEP_HALF_DEBUG_STATS=y -DCONFIG_ZMK_LOGGING_MINIMAL=y -DCONFIG_ZMK_LOG_LEVEL_INF=y
    artifact-name: cradio_left_debug

  # Диагностика правой половинки: лог по USB плюс состояние отправки нажатий
  # и причина перезагрузки. Сценарий, ради которого появилась: после
  # перезагрузки донгла линк к правой есть, а нажатий с неё нет до её ресета.
  - board: nice_nano//zmk
    shield: cradio_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_SWEEP_HALF_DEBUG_STATS=y -DCONFIG_ZMK_LOG_LEVEL_INF=y
    artifact-name: cradio_right_debug
