# --- Дисплей ---------------------------------------------------------------
# CONFIG_SSD16XX включается сам (default y) при активном узле solomon,ssd1681
# и сам делает select SPI. Нужен только сам подсистемный DISPLAY.
CONFIG_DISPLAY=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# 1 бит на пиксель: 200x200 = 5000 байт на кадр.
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_USE_LABEL=y

# Полноэкранный буфер обязателен: при меньшем LVGL сбрасывает кадр полосами,
# а ssd16xx делает refresh на каждый display_write — вместо одного обновления
# получилось бы несколько подряд.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_MEM_POOL_SIZE=16384

CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# Тик — это только lv_task_handler(); flush уходит в панель лишь по
# инвалидации. Но сам таймер будит процессор, а при 100 мс это десять
# пробуждений в секунду впустую: наши отрисовки и так разнесены на секунды.
CONFIG_ZMK_DISPLAY_TICK_PERIOD_MS=1000

# КРИТИЧНО для ввода. По умолчанию ZMK крутит отрисовку в системной очереди
# работ — той же, через которую идут события клавиш от половинок и HID.
# Драйвер ssd16xx на каждом refresh ждёт на пине BUSY сотни миллисекунд, и всё
# это время ввод стоит колом. Уносим экран в свою очередь с низким
# приоритетом, чтобы обработка клавиш её вытесняла.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=10
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# --- USB CDC-ACM: канал от агента на маке ----------------------------------
CONFIG_ZMK_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y

# --- Отладка ----------------------------------------------------------------

# --- Энергосбережение -------------------------------------------------------
# Пять минут без нажатий — и ZMK переводит устройство в состояние простоя.
# Считаются именно события позиций, то есть нажатия, пришедшие с половинок.
CONFIG_ZMK_IDLE_TIMEOUT=300000

# Глубокий сон намеренно НЕ включаем (ZMK_SLEEP=n в Kconfig.defconfig): он
# гасит радио, а разбудить донгл нажатием на половинке можно только по радио —
# своих кнопок у него нет. Клавиатура бы просто умерла до ручного сброса.

# Гасить панель на простое тоже не надо: для e-paper это означает
# display_blanking_on, а снятие блокировки стоит одного ПОЛНОГО обновления с
# миганием всего экрана. Картинка и так держится без питания.

# --- Сплит: донгл как central ----------------------------------------------
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
# Заряд половинок донгл НЕ собирает — это обход zmkfirmware/zmk#3156, и
# снимать его без замеров нельзя.
#
# Симптом (пойман живьём 11.09.2026): после перезагрузки донгла одна половинка
# подключается, шифруется, отдаёт заряд — и не шлёт ни одного нажатия, пока её
# не ресетнуть. Телеметрия показала 110 секунд живого линка к правой и ноль
# нажатий с неё, после её ресета — 558.
#
# Механизм из issue: обходя характеристики половинки, ZMK подписывается на
# батарею сразу, как только её находит, а Zephyr для подписки запускает
# вложенный поиск CCC-дескриптора. Он сталкивается с идущим обходом, очередной
# шаг bt_gatt_discover падает с -ENOMEM, и обход кончается «Discover complete»,
# так и не дойдя до характеристики нажатий. Подписки на нажатия нет — половинка
# немая. Батарея у ZMK находится РАНЬШЕ нажатий, в нашем логе тоже.
#
# Upstream закрыл issue расширением пула (#3216), ревьюер прямо пишет, что это
# лишь «brings us to equal state with v0.3», — а на v0.3 мы баг и ловим.
# Настоящий фикс (#3411: отложить подписки до конца обхода) на 12.09.2026 не
# влит, и автор пишет, что проблему он не снял полностью. Люди с тем же
# симптомом («dead right half on replug») выключают сбор заряда —
# vitaliikindrat/zmk-keyboard-cornix@44341408.
#
# Цена: на экране донгла и в меню мака нет заряда половинок, заряд самого
# донгла на месте. Вернуть — после влития #3411 в используемую версию ZMK.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Пул запросов ATT. В Zephyr 3.5 (наша v0.3) его размер задаёт именно
# BT_L2CAP_TX_BUF_COUNT: subsys/bluetooth/host/att.c,
#     K_MEM_SLAB_DEFINE(req_slab, …, CONFIG_BT_L2CAP_TX_BUF_COUNT, …)
# ZMK v0.3 ставит центральному 5. Продолжение обхода вызывается из потока
# приёма, где bt_att_req_alloc берёт слот без ожидания, так что пустой пул —
# это мгновенный отказ, а не задержка. Две половинки, ищущие сервисы
# одновременно, плюс подписки выбирают 5 слотов целиком.
#
# 10 — значение ZMK main после #3216 (там символ другой: BT_ATT_TX_COUNT, потому
# что в Zephyr 4.1 пул переехал). Даже без подписки на батарею автор #3156 видел
# недообход у одной из половинок, так что запас нужен и с выключенным сбором.
# Цена — несколько сотен байт RAM; BT_CONN_TX_MAX подтягивается следом сам.
CONFIG_BT_L2CAP_TX_BUF_COUNT=10

# Формула из документации ZMK по донглу: периферии + 5.
# https://zmk.dev/docs/development/hardware-integration/dongle
#
# Впритык ставить нельзя. Одновременно живут один хост и две половинки, то есть
# три соединения, но объект соединения в Zephyr освобождается не мгновенно: при
# переподключении половины новый коннект упирается в лимит, половина
# отваливается, центральный уходит в скан, скан отъедает эфирное время — и ввод
# начинает тормозить. Проверено на себе со значением 3.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Своя батарея донгла, показывается рядом с батареями половинок.
CONFIG_ZMK_BATTERY_REPORTING=y

# --- 2M PHY выключен --------------------------------------------------------
#
# Жалоба 12.09.2026: через 15-20 минут работы от батареи нажатия с ОБЕИХ
# половинок доходят до мака с задержкой, по USB всё хорошо. Сплит-линки за 23
# часа лога чистые (пачки ~1 %), значит, затык на участке донгл -> мак.
#
# Для v0.3 + nice!nano это известная история: zmkfirmware/zmk#3158 «v0.3.0 -
# issue with nice!nano bluetooth» — по USB работает, по BT нет, на v0.2 не было;
# помогло CONFIG_BT_CTLR_PHY_2M=n. Документация ZMK о
# CONFIG_ZMK_BLE_EXPERIMENTAL_CONN: «Currently this only disables 2M PHY
# support», и это планируется сделать поведением по умолчанию ради стабильности
# соединения. Ставим через него, а не голым символом контроллера, — чтобы при
# обновлении ZMK получить всё, что туда добавят.
#
# Честно: у автора #3158 была проблема соединения, а не задержка через время, —
# совпадение версии, платы и «по USB всё хорошо», не доказательство. Проверять
# телеметрией `hid:` отладочной сборки (link_stats.c).
#
# Хватает одного донгла: PHY согласуют обе стороны, и если контроллер донгла 2M
# не поддерживает, и линк к маку, и сплит-линки остаются на 1M.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- Параметры сплит-линка (донгл -> половинки) -----------------------------
#
# Задаются ТОЛЬКО здесь, и это не стилистика. Центральный диктует их в
# bt_conn_le_create (app/src/split/bluetooth/central.c), а половинка не может
# ни возразить, ни попросить своё: у периферии сплита ZMK принудительно ставит
# BT_GAP_AUTO_UPDATE_CONN_PARAMS=n. Блок CONFIG_BT_PERIPHERAL_PREF_* в
# config/cradio.conf был поэтому чистым no-op — подробности в комментарии там.

# Интервал 7.5 мс — штатный дефолт ZMK, оставляем.
#
# Была попытка растянуть его до 15 мс ради экономии: центральный обязан
# дежурить на каждом событии соединения по каждому линку, поэтому вдвое больший
# интервал вдвое сокращает работу радио. Но батарея донгла в этой архитектуре
# всё равно упирается в потолок — апстрим прямо пишет, что центральный в
# донгл-режиме «usually powered by USB» — а отзывчивость от растягивания
# страдает. Приоритет за отзывчивостью, значение вернулось к 6.
#
# Экспериментальные настройки sub-7.5 мс из zmkfirmware/zmk#3381 намеренно НЕ
# применяются: автор сообщает о падениях central и peripheral в своих тестах,
# они требуют перепрошивки обеих половинок и кратно увеличивают потребление.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6

# А вот latency у ZMK по умолчанию 30, и это главная правка этого файла.
#
# При интервале 7.5 мс половинка вправе молчать до 225 мс подряд, и ровно на
# столько растягивается окно, в котором нажатия с двух рук расходятся по
# порядку (zmkfirmware/zmk#1633). С нулём половинка ресинхронизируется на
# каждом событии соединения, окно сжимается до одного интервала, а потеря
# пакета исправляется сразу, а не через четверть секунды — то есть разрывов по
# супервизорному таймауту становится МЕНЬШЕ, а не больше.
#
# Цена честная, и её надо знать: радио половинки теперь просыпается каждые
# 7.5 мс вместо раза в 225 мс, автономность половинок заметно падает. На
# потребление ДОНГЛА это не влияет никак — центральный обязан присутствовать на
# каждом событии соединения при любой latency. Если автономность половинок
# окажется важнее отзывчивости, возвращать 30 надо СЮДА, а не в cradio.conf.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# Штатный дефолт ZMK, 4 секунды. Спецификация требует превышения
# (1 + latency) * интервал * 2, с нулевой latency запас огромный.
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

# --- Параметры линка к хосту (донгл как периферия) --------------------------
#
# Здесь три источника параметров, и раньше они спорили друг с другом:
#
#   * PPCP — характеристика Peripheral Preferred Connection Parameters, которую
#     хост читает СРАЗУ при подключении. Её содержимое — это
#     CONFIG_BT_PERIPHERAL_PREF_*, у ZMK по умолчанию 6/12/30/400;
#   * автоматический L2CAP-запрос Zephyr теми же значениями через 5 с после
#     коннекта (в роли central BT_GAP_AUTO_UPDATE_CONN_PARAMS остаётся
#     включённым, в отличие от половинок);
#   * явный запрос из dongle/src/host_params.c.
#
# Apple принимает от аксессуара только интервал от 15 мс, разницу между
# минимумом и максимумом не меньше 15 мс, latency до 30 и таймаут до 6 с.
# Дефолтные 7.5-15 мс под это не подходят, поэтому macOS игнорировала и PPCP, и
# автоматический запрос, а назначала своё: замер на живом устройстве дал
# interval 12 latency 22 timeout 200 — до 330 мс, на которые может опоздать
# нажатие.
#
# Приводим PPCP к тем же значениям, которые просит host_params.c. Тогда
# приемлемые параметры хост видит В МОМЕНТ подключения, а не через пять секунд,
# автоматический запрос перестаёт гоняться с нашим, и все три источника говорят
# одно и то же. Менять эти четыре строки только вместе с константами
# HOST_INTERVAL_* / HOST_LATENCY / HOST_TIMEOUT в dongle/src/host_params.c.
#
# Про latency 0 отдельно: была попытка поставить 30 ради экономии. Рассуждение
# выглядело так: спецификация разрешает периферии выходить в эфир на ближайшем
# событии, если есть что передать, поэтому нажатия задерживаться не должны.
# Разрешает — но не обязывает, и контроллер Zephyr выдерживает latency честно:
# передача нажатий на хост стала ощутимо вязкой. Не возвращать без замеров.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
