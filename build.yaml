# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano_v2
    shield: cradio_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: cradio_left_studio
    
  - board: nice_nano_v2
    shield: cradio_right
    
  - board: nice_nano_v2
    shield: settings_reset

  - board: nice_nano_v2
    shield: sweep_dongle

  # Диагностическая сборка: логи по USB плюс метки времени прихода нажатий.
  # Собирается рядом с обычной, чтобы не приходилось править конфиг ради
  # разового замера. Убрать, когда вопрос с задержками закроется.
  - board: nice_nano_v2
    shield: sweep_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_SWEEP_DONGLE_DEBUG_LATENCY=y -DCONFIG_ZMK_LOG_LEVEL_INF=y
    artifact-name: sweep_dongle_debug
